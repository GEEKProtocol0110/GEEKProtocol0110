<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">GEEK Protocol — Proof of Learning on Kaspa. Learn. Play. Build.</title>
  <desc id="desc">A dark teal and gold engineering banner: HUD corners, a Kaspa-style blockDAG constellation, and the Geek Protocol wordmark. All hope, no hype.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.92" y2="1">
      <stop stop-color="#05090d"/>
      <stop offset="0.55" stop-color="#071217"/>
      <stop offset="1" stop-color="#0a1c1e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8af3e0"/>
      <stop offset="1" stop-color="#49EACB"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8e19a"/>
      <stop offset="1" stop-color="#d9a33c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.46" r="0.48">
      <stop stop-color="#49EACB" stop-opacity=".18"/>
      <stop offset="0.45" stop-color="#49EACB" stop-opacity=".06"/>
      <stop offset="1" stop-color="#49EACB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldglow" cx="0.18" cy="0.2" r="0.4">
      <stop stop-color="#d9a33c" stop-opacity=".07"/>
      <stop offset="1" stop-color="#d9a33c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#49EACB" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="1280" height="3" patternUnits="userSpaceOnUse">
      <rect width="1280" height="1" fill="#49EACB" fill-opacity=".028"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#scan)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <rect width="1280" height="400" fill="url(#goldglow)"/>

  <!-- left rail -->
  <rect x="0" y="0" width="6" height="400" fill="#49EACB" fill-opacity=".85"/>
  <rect x="6" y="0" width="2" height="400" fill="#d9a33c" fill-opacity=".75"/>

  <!-- HUD corners -->
  <g fill="none" stroke="#49EACB" stroke-width="1.6" stroke-opacity=".85">
    <path d="M36 28h48M36 28v48"/>
    <path d="M1244 28h-48M1244 28v48"/>
    <path d="M36 372h48M36 372v-48"/>
    <path d="M1244 372h-48M1244 372v-48"/>
  </g>
  <g fill="none" stroke="#d9a33c" stroke-width="1" stroke-opacity=".55">
    <path d="M36 28h16"/>
    <path d="M1244 28h-16"/>
    <path d="M36 372h16"/>
    <path d="M1244 372h-16"/>
  </g>

  <!-- Kaspa-style blockDAG constellation -->
  <g transform="translate(0 8)" fill="none" stroke="#49EACB" stroke-linecap="round">
    <g stroke-opacity=".22" stroke-width="1.25">
      <path d="M820 268 900 210 980 168 1060 150 1148 168"/>
      <path d="M848 310 930 248 1018 210 1100 198 1184 230"/>
      <path d="M880 140 960 118 1040 108 1128 128 1200 168"/>
      <path d="M900 210 960 118"/>
      <path d="M980 168 1018 210"/>
      <path d="M1060 150 1100 198"/>
      <path d="M930 248 980 168"/>
      <path d="M1018 210 1060 150"/>
      <path d="M1100 198 1148 168"/>
      <path d="M848 310 900 210"/>
      <path d="M1148 168 1184 230"/>
      <path d="M1128 128 1148 168"/>
      <path d="M1040 108 1060 150"/>
      <path d="M980 168 1040 108"/>
    </g>
    <g stroke="#d9a33c" stroke-opacity=".16" stroke-width="1">
      <path d="M900 210 1040 108 1184 230"/>
    </g>
  </g>
  <g fill="#49EACB">
    <circle cx="820" cy="276" r="3.2" fill-opacity=".7"/>
    <circle cx="848" cy="318" r="3"/>
    <circle cx="880" cy="148" r="3.2"/>
    <circle cx="900" cy="218" r="4.2"/>
    <circle cx="930" cy="256" r="3.4"/>
    <circle cx="960" cy="126" r="3.6"/>
    <circle cx="980" cy="176" r="4.6"/>
    <circle cx="1018" cy="218" r="3.8"/>
    <circle cx="1040" cy="116" r="4"/>
    <circle cx="1060" cy="158" r="5" fill="#8af3e0"/>
    <circle cx="1100" cy="206" r="3.6"/>
    <circle cx="1128" cy="136" r="3.4"/>
    <circle cx="1148" cy="176" r="4.2"/>
    <circle cx="1184" cy="238" r="3.2"/>
    <circle cx="1200" cy="176" r="3"/>
  </g>
  <g fill="#d9a33c">
    <circle cx="1060" cy="158" r="2"/>
    <circle cx="980" cy="176" r="1.6"/>
    <circle cx="900" cy="218" r="1.4"/>
  </g>

  <!-- wordmark lockup -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="86" fill="#49EACB" font-size="13" font-weight="700" letter-spacing="5.5" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace">PROOF OF LEARNING  //  KASPA</text>

    <!-- chevron mark -->
    <g transform="translate(60 108)" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M4 56 40 16h50L54 56l36 40H40Z" stroke="url(#teal)" stroke-width="7.5"/>
      <path d="m62 56 36-40h50L112 56l36 40H98Z" stroke="url(#gold)" stroke-width="7.5"/>
      <circle cx="76" cy="56" r="4.5" fill="#eff9f5" stroke="none"/>
    </g>

    <text x="248" y="178" fill="#f4fbf8" font-size="72" font-weight="800" letter-spacing="-1.5">GEEK PROTOCOL</text>
    <text x="252" y="222" fill="#c5d8d3" font-size="22" letter-spacing="0.4">Your knowledge is now an asset.</text>

    <g>
      <rect x="252" y="252" width="10" height="10" fill="#49EACB"/>
      <text x="274" y="263" fill="#f5d179" font-size="18" font-weight="700" letter-spacing="4.5">LEARN  ·  PLAY  ·  BUILD</text>
    </g>

    <text x="252" y="308" fill="#8aa8a3" font-size="16">Built for the Kaspa community. All hope, no hype.</text>
  </g>

  <!-- PUBLIC ALPHA chip -->
  <g transform="translate(252 332)">
    <rect x="0" y="0" width="132" height="26" rx="2" fill="none" stroke="#49EACB" stroke-opacity=".7" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="26" fill="#49EACB"/>
    <text x="18" y="18" fill="#49EACB" font-size="12" font-weight="700" letter-spacing="2.4" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace">PUBLIC ALPHA</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" fill="#49EACB" fill-opacity=".45" font-size="10" letter-spacing="1.6">
    <text x="1088" y="368">BLOCKDAG  ·  OPEN SOURCE</text>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="399" fill="none" stroke="#3d6f68" stroke-opacity=".55" stroke-width="1"/>
</svg>
